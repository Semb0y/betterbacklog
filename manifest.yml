app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/3f533a1c-74b9-47a6-b3af-0a4931f5edae

modules:
  jira:issuePanel:
    - key: betterbacklog-jira-panel
      resource: main
      resolver:
        function: handler-function
      title: BetterBacklog
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      location: sidebar

  function:
    - key: handler-function
      handler: index.handler

resources:
  - key: main
    path: static/frontend/build

permissions:
  external:
    fetch:
      backend:
        - address: https://api.anthropic.com
  content:
    styles:
      - unsafe-inline
    scripts:
      - unsafe-inline
  scopes:
    - read:jira-work
    - storage:app
    - read:jira-user
